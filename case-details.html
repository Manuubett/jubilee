<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Case Details | Jubilee Embu - Kangaru Membership Service System</title>

  <link rel="stylesheet" href="./css/app.css" />
</head>

<body>
  <div id="app-shell"></div>

  <main class="app-main">
    <header class="topbar">
      <div class="topbar-left">
        <button type="button" class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Open navigation">☰</button>

        <div>
          <h1 class="page-title">Case Details</h1>
          <p class="page-subtitle" id="caseSubtitle">Loading case...</p>
        </div>
      </div>

      <div class="topbar-right">
        <div class="user-menu" id="userMenu">
          <div class="user-avatar" id="userAvatar">U</div>
          <div class="user-info">
            <strong id="topbarUserName">User</strong>
            <span id="topbarUserRole">OFFICER</span>
          </div>
        </div>
      </div>
    </header>

    <section class="page-content">

      <div id="pageError" class="alert alert-danger hidden" role="alert"></div>

      <div id="caseLoading" class="dashboard-loading">
        <div class="loading-spinner"></div>
        <span>Loading case...</span>
      </div>

      <div id="caseContent" class="hidden">

        <div class="page-heading-row">
          <div>
            <h2 id="caseReferenceHeading">Case</h2>
            <p id="caseCreatedText"></p>
          </div>

          <a href="./cases.html" class="btn btn-secondary">← Back to Cases</a>
        </div>

        <div class="dashboard-grid">

          <!-- Case details -->
          <section class="dashboard-panel panel-large">
            <div class="panel-header">
              <div>
                <h3>Applicant &amp; Case Information</h3>
              </div>
            </div>

            <div style="padding: 22px;" id="caseInfoGrid">
              <!-- Populated by case-details.js -->
            </div>
          </section>

          <!-- Status update -->
          <section class="dashboard-panel">
            <div class="panel-header">
              <div>
                <h3>Update Status</h3>
              </div>
            </div>

            <div style="padding: 22px;">
              <div class="form-group">
                <label for="statusSelect">Case Status</label>
                <select id="statusSelect" class="form-control">
                  <option value="NEW">New</option>
                  <option value="IN_PROGRESS">In Progress</option>
                  <option value="WAITING">Waiting</option>
                  <option value="RESOLVED">Resolved</option>
                  <option value="CLOSED">Closed</option>
                </select>
              </div>

              <div class="form-group">
                <label for="prioritySelect">Priority</label>
                <select id="prioritySelect" class="form-control">
                  <option value="LOW">Low</option>
                  <option value="MEDIUM">Medium</option>
                  <option value="HIGH">High</option>
                  <option value="URGENT">Urgent</option>
                </select>
              </div>

              <button type="button" class="btn btn-primary btn-block" id="saveStatusBtn">
                Save Changes
              </button>

              <p
                id="statusSavedMessage"
                class="hidden"
                style="margin-top: 10px; color: var(--success); font-size: 13px;"
              >
                Saved.
              </p>
            </div>
          </section>

        </div>

        <!-- ORPP tracking (membership registration / resignation only) -->
        <section class="dashboard-panel hidden" id="trackingPanel" style="margin-bottom: 22px;">
          <div class="panel-header">
            <div>
              <h3 id="trackingTitle">ORPP tracking</h3>
              <p id="trackingSubtitle"></p>
            </div>
          </div>

          <div style="padding: 22px;">
            <div class="form-grid" id="trackingFields"></div>

            <div class="form-actions">
              <button type="button" class="btn btn-primary" id="saveTrackingBtn">
                Save Tracking
              </button>

              <span
                id="trackingSavedMessage"
                class="hidden"
                style="color: var(--success); font-size: 13px;"
              >Saved.</span>
            </div>
          </div>
        </section>

        <!-- Follow-ups -->
        <section class="dashboard-panel">
          <div class="panel-header">
            <div>
              <h3>Follow-ups</h3>
              <p>Scheduled follow-up actions for this case</p>
            </div>
          </div>

          <div style="padding: 22px; border-bottom: 1px solid var(--border);">
            <div class="form-grid">
              <div class="form-group">
                <label for="followupNote">Follow-up Note *</label>
                <input type="text" id="followupNote" class="form-control" placeholder="e.g. Call applicant to confirm documents" />
              </div>

              <div class="form-group">
                <label for="followupDueDate">Due Date *</label>
                <input type="date" id="followupDueDate" class="form-control" />
              </div>
            </div>

            <button type="button" class="btn btn-primary" id="addFollowupBtn" style="margin-top: 6px;">
              ＋ Add Follow-up
            </button>
          </div>

          <div class="table-wrapper">
            <table class="data-table cases-table">
              <thead>
                <tr>
                  <th>Note</th>
                  <th>Due Date</th>
                  <th>Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="followupsTableBody">
                <tr>
                  <td colspan="4" class="table-empty">No follow-ups yet.</td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>

      </div>

    </section>
  </main>

  <script type="module" src="./js/case-details.js"></script>
</body>
</html>
