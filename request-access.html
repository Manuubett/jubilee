<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Request Access | Jubilee Embu - Kangaru Membership Service System</title>

  <link rel="stylesheet" href="./css/app.css" />
</head>

<body class="login-page">

  <div class="login-card">

    <div class="login-brand">
      <div class="jubilee-mark">
        <img src="./assets/jubilee-logo.png" alt="Jubilee Party logo" />
      </div>

      <h1>Request Access</h1>
      <p>Embu - Kangaru Office</p>
    </div>

    <div id="successBox" class="alert alert-success hidden" role="status">
      <strong>Request sent.</strong> An administrator will review it. You
      will be able to sign in once you are approved.
      <div style="margin-top: 12px;">
        <a href="./index.html" class="table-link">← Back to sign in</a>
      </div>
    </div>

    <form id="requestForm">

      <div id="formError" class="alert alert-danger hidden" role="alert"></div>

      <div class="form-group">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" class="form-control" required autocomplete="name" />
      </div>

      <div class="form-group">
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" class="form-control" placeholder="07XX XXX XXX" required autocomplete="tel" />
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" class="form-control" required autocomplete="email" />
      </div>

      <div class="form-group">
        <label for="requestNote">Your role at the office</label>
        <input
          type="text"
          id="requestNote"
          class="form-control"
          placeholder="e.g. Front desk officer, Office secretary"
          required
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" class="form-control" minlength="8" required autocomplete="new-password" />
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword" class="form-control" minlength="8" required autocomplete="new-password" />
      </div>

      <button type="submit" class="btn btn-primary btn-block" id="submitBtn">
        Send Request
      </button>

      <p style="text-align: center; margin: 18px 0 0; font-size: 14px; color: var(--muted);">
        Already approved?
        <a href="./index.html" class="table-link">Sign in</a>
      </p>

    </form>

  </div>

  <script type="module" src="./js/request-access.js"></script>
</body>
</html>
