<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Jubilee Embu — Membership Service</title>

  <link
    rel="stylesheet"
    href="css/app.css"
  >

</head>

<body class="login-page">

  <div class="login-card">

    <div class="login-brand">

      <div class="jubilee-mark">
        J
      </div>

      <h1>
        Membership Service
      </h1>

      <p>
        Embu Office
      </p>

    </div>


    <form id="loginForm">

      <div class="form-group">

        <label for="email">
          Staff Email
        </label>

        <input
          id="email"
          class="form-control"
          type="email"
          autocomplete="username"
          required
        >

      </div>


      <div class="form-group">

        <label for="password">
          Password
        </label>

        <input
          id="password"
          class="form-control"
          type="password"
          autocomplete="current-password"
          required
        >

      </div>


      <button
        class="btn-primary btn-block"
        type="submit"
      >
        Sign In
      </button>


      <div
        id="loginError"
        class="login-error"
      ></div>

    </form>

  </div>


  <script
    type="module"
    src="js/auth.js"
  ></script>

</body>

</html>
